  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- steam -->
  <g fill="#bfa58c" opacity="0.75">
    <rect x="6" y="0" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/>
    <rect x="9" y="0" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/>
  </g>
  <!-- faint glass tint above the drink -->
  <rect x="3" y="4" width="10" height="2" fill="#dfe9ee" opacity="0.35"/>
  <!-- crema -->
  <rect x="3" y="6" width="10" height="1" fill="#d9a066"/>
  <rect x="3" y="7" width="10" height="1" fill="#b8763f"/>
  <rect x="5" y="6" width="1" height="1" fill="#e8bd86"/>
  <rect x="9" y="6" width="1" height="1" fill="#e8bd86"/>
  <rect x="7" y="7" width="1" height="1" fill="#d9a066"/>
  <!-- espresso body -->
  <rect x="3" y="8" width="10" height="3" fill="#4a2a1a"/>
  <rect x="4" y="11" width="8" height="1" fill="#3b2115"/>
  <rect x="4" y="12" width="8" height="2" fill="#2c180f"/>
  <!-- thick glass base -->
  <rect x="4" y="14" width="8" height="1" fill="#c7d6dd" opacity="0.7"/>
  <!-- glass outline: rim, walls, bottom -->
  <g fill="#9fb2bb">
    <rect x="2" y="3" width="12" height="1"/>
    <rect x="2" y="4" width="1" height="7"/>
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="3" y="15" width="10" height="1"/>
  </g>
  <g fill="#7f939d">
    <rect x="13" y="4" width="1" height="7"/>
    <rect x="12" y="11" width="1" height="4"/>
  </g>
  <!-- reflection highlight -->
  <rect x="4" y="4" width="1" height="7" fill="#ffffff" opacity="0.55"/>
  <rect x="5" y="11" width="1" height="2" fill="#ffffff" opacity="0.3"/>
  <rect x="2" y="3" width="2" height="1" fill="#e6eef2"/>
</svg>
